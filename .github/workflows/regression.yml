name: Stars native regression

on:
  pull_request:
  push:
    branches: [main, '2.8']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression (${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Scenarios covered by the checked-in native baseline
        # (tests/scaffold/fixtures/regression/native/run.json).
        scenario: [noai, oneai1, oneai2, oneai3, oneai4, oneai5, oneai6, smallai4, smallai6]
    env:
      SCENARIO: ${{ matrix.scenario }}
      WINEDEBUG: '-all'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tests/savecli/go.mod
          cache-dependency-path: tests/savecli/go.sum

      - name: Install Wine, MinGW and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y wine64 wine gcc-mingw-w64-x86-64 cmake ninja-build python3-yaml xvfb xauth

      - name: Build stars.exe and save CLI
        run: |
          cmake --preset mingw-release -B dist/regression-build
          cmake --build dist/regression-build --parallel 2
          make save-cli

      - name: Check that game arithmetic uses software floating point
        run: |
          python3 tests/scaffold/test_check_software_float.py --cc x86_64-w64-mingw32-gcc --objdump x86_64-w64-mingw32-objdump
          python3 tests/scaffold/check_software_float.py --build dist/regression-build --objdump x86_64-w64-mingw32-objdump

      - name: Generate native checkpoints through turn 150
        env:
          WINEPREFIX: ${{ runner.temp }}/stars-regression
        run: |
          mkdir -p "$WINEPREFIX" dist/scaffold/regression
          xvfb-run -a -s '-screen 0 1600x1200x24' bash -e -o pipefail <<'EOF'
          wineboot -u > dist/scaffold/regression/wineboot.log 2>&1
          cp tests/scaffold/fixtures/regression/Stars.ini "$WINEPREFIX/drive_c/windows/Stars.ini"
          python3 tests/scaffold/regression.py prepare --seed 12345 \
            --exe dist/regression-build/bin/stars.exe --work dist/scaffold/regression/native
          python3 tests/scaffold/regression.py run --work dist/scaffold/regression/native \
            --scenario "$SCENARIO" --through 150 --timeout 300
          EOF

      - name: Compare against native baseline
        run: |
          python3 tests/scaffold/regression.py compare \
            tests/scaffold/fixtures/regression/native dist/scaffold/regression/native \
            --scenario "$SCENARIO" --through 150 --report dist/scaffold/regression/comparison.json

      - name: Show first difference on failure
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = Path('dist/scaffold/regression/comparison.json')
          if report.is_file():
              for result in json.loads(report.read_text()):
                  if not result.get('match', False) and 'skipped' not in result:
                      print(f"{result['scenario']}: turn {result['turn']}, {result.get('file', '')}")
                      print(result.get('detail', result.get('error', 'comparison failed')))
                      break
          PY

      - name: Retain regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.scenario }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/scaffold/regression/
          if-no-files-found: warn
          retention-days: 30

  # The same scenarios and baseline through stars-host built natively with
  # gcc on x86-64 Linux, without Wine.
  host-linux:
    name: Regression (stars-host, Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tests/savecli/go.mod
          cache-dependency-path: tests/savecli/go.sum

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build python3-yaml

      - name: Generate and compare all scenarios through turn 150
        run: make regression-host

      - name: Retain regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-host-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/scaffold/regression/
          if-no-files-found: warn
          retention-days: 30
